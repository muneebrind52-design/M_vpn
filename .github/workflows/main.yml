name: Build Muneeb VPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Locate Project Root & Build APK
        run: |
          flutter config --no-analytics

          # Unzip if user uploaded zip file directly
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping package: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          fi

          # Find pubspec.yaml directory
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            ls -la
            exit 1
          fi

          TARGET_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Building project in: $TARGET_DIR"
          cd "$TARGET_DIR"

          flutter pub get
          flutter build apk --release

          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output_apk/muneeb_vpn_release.apk

      - name: Upload APK Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: Muneeb_VPN_Release_APK
          path: output_apk/muneeb_vpn_release.apk
